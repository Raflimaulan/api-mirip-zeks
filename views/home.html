<!DOCTYPE html>

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Font: Inter */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        :root {
            --neon-green: #3B82F6; /* Tailwind Blue-500 */
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Dark, futuristic background */
            background-color: #0A0A0F;
            background-image: radial-gradient(circle at 50% 100%, #111827 0%, #0A0A0F 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: all 0.5s ease;
        }

        /* Centering the main content on screen */
        .container-center {
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typing Effect Custom Cursor */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em; /* Match font size */
            margin-left: 2px;
            background-color: var(--neon-green);
            animation: blink .7s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            from, to { opacity: 0.8; }
            50% { opacity: 0; }
        }

        /* Neon Glow Effect for Status Text */
        .typed-text {
            color: var(--neon-green);
            text-shadow: 0 0 5px rgba(59, 130, 246, 0.5), 0 0 10px rgba(59, 130, 246, 0.3);
            font-weight: 700;
        }

        /* Modern Button/Link Style */
        .neon-button {
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(59, 130, 246, 0.4);
        }
        .neon-button:hover {
            box-shadow: 0 0 10px var(--neon-green), 0 0 20px rgba(59, 130, 246, 0.6);
            transform: translateY(-2px);
        }

    </style>
</head>

<body>
    <div class="container-center w-full max-w-lg mx-auto bg-gray-900/70 backdrop-blur-sm p-6 sm:p-10 rounded-xl border border-gray-700/50 shadow-2xl">

    <script>
        // === Typing Effect Logic (Modernized) ===
        const typedTextSpan = document.querySelector(".typed-text");
        const textArray = ["ACTIVE", "ONLINE", "READY"]; // Changed ~ to clean text
        const typingDelay = 150;
        const erasingDelay = 75;
        const newTextDelay = 1500; // Delay before starting next word
        let textArrayIndex = 0;
        let charIndex = 0;

        function type() {
            if (charIndex < textArray[textArrayIndex].length) {
                typedTextSpan.textContent += textArray[textArrayIndex].charAt(charIndex);
                charIndex++;
                setTimeout(type, typingDelay);
            } else {
                setTimeout(erase, newTextDelay);
            }
        }

        function erase() {
            if (charIndex > 0) {
                typedTextSpan.textContent = textArray[textArrayIndex].substring(0, charIndex - 1);
                charIndex--;
                setTimeout(erase, erasingDelay);
            } else {
                textArrayIndex++;
                if (textArrayIndex >= textArray.length) {
                    textArrayIndex = 0;
                }
                setTimeout(type, 500); // Shorter delay before typing the new word
            }
        }

        // Start the typing effect when the page content is fully loaded
        document.addEventListener("DOMContentLoaded", function() {
            // Check if the span exists before starting
            if (typedTextSpan) {
                setTimeout(type, 1000); 
            }
        });

        // The old jQuery/AJAX submission logic was removed as it was for form handling
        // and doesn't seem relevant for a static landing page/documentation entry point.

    </script>
